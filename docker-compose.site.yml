# =============================================================================
# HeyGoodly Site Stack (Isolated DB & Redis, Shared MinIO & Shared Nginx)
# Prerequisite: cd ../shared-infra && ./scripts/up-shared.sh
# Usage:        docker compose -f docker-compose.site.yml up -d --build
# =============================================================================
name: ${APP_SLUG:-heygoodly}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_SLUG:-heygoodly}-postgres
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    command: postgres -c shared_buffers=128MB -c max_connections=60 -c log_min_duration_statement=500
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heygoodly_db}
      POSTGRES_USER: ${POSTGRES_USER:-heygoodly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - site-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heygoodly_user} -d ${POSTGRES_DB:-heygoodly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-heygoodly}-redis
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - site-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_SLUG:-heygoodly}-backend
    restart: unless-stopped
    mem_limit: 960m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx640m -XX:+UseG1GC}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${APP_SLUG:-heygoodly}-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-heygoodly_db}
      DB_USER: ${POSTGRES_USER:-heygoodly_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-15}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      REDIS_HOST: ${APP_SLUG:-heygoodly}-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://shared-minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:80/media}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-heygoodly-media}
      JWT_SECRET: ${JWT_SECRET:-Q0hBTkdFX01FX0pXVF9TRUNSRVJfNDhfQllURVNfT05fVlBTXzIwMjY=}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-86400000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://heygoodly.localhost,http://localhost:3001}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-HeyGoodlyProCMS}
      AFFILIATE_DEFAULT_FALLBACK_URL: ${AFFILIATE_DEFAULT_FALLBACK_URL:-${NEXT_PUBLIC_SITE_URL:-http://localhost:80}}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/app/geoip/GeoLite2-Country.mmdb}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    volumes:
      - ./deploy/geoip:/app/geoip:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    networks:
      - site-internal
      - shared-gateway-net
      - shared-minio-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:80}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:80}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-HeyGoodly}
    container_name: ${APP_SLUG:-heygoodly}-frontend
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:80}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:80}
      BACKEND_INTERNAL_URL: http://${APP_SLUG:-heygoodly}-backend:8080
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3001}:3000"
    networks:
      - site-internal
      - shared-gateway-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    name: ${APP_SLUG:-heygoodly}_postgres_data
  redis_data:
    name: ${APP_SLUG:-heygoodly}_redis_data

networks:
  site-internal:
    name: ${APP_SLUG:-heygoodly}-internal-net
    driver: bridge
  shared-gateway-net:
    external: true
    name: shared-gateway-net
  shared-minio-net:
    external: true
    name: shared-minio-net
