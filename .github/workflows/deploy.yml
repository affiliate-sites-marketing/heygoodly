name: HeyGoodly Docker Release & Production CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: "Deploy automatically to production VPS over SSH"
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-heygoodly
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Image Prefix
        id: repo
        run: |
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Spring Boot Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner_repo }}-backend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner_repo }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=heygoodly-backend
          cache-to: type=gha,mode=max,scope=heygoodly-backend

      - name: Build and Push Next.js Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost' }}
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME || 'HeyGoodly' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner_repo }}-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner_repo }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=heygoodly-frontend
          cache-to: type=gha,mode=max,scope=heygoodly-frontend

  deploy-production:
    name: Deploy HeyGoodly to Shared Production VPS
    needs: build-and-push
    if: ${{ github.event_name == 'push' || inputs.deploy_to_vps == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS SSH Configuration
        id: vps_check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST secret is not set; skipping SSH deploy."
          fi

      - name: Deploy HeyGoodly Stack over SSH
        if: steps.vps_check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/heygoodly' }}"
            echo "==> Deploying HeyGoodly to $DEPLOY_PATH..."
            cd "$DEPLOY_PATH"
            git pull origin main

            docker network inspect shared-minio-net >/dev/null 2>&1 || docker network create shared-minio-net
            docker network inspect shared-gateway-net >/dev/null 2>&1 || docker network create shared-gateway-net

            if ! docker ps --format '{{.Names}}' | grep -qx 'shared-minio'; then
              echo "ERROR: shared-minio is not running! Start /opt/shared-infra first."
              exit 1
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx 'shared-nginx'; then
              echo "ERROR: shared-nginx is not running! Start /opt/shared-infra first."
              exit 1
            fi

            echo "==> Starting HeyGoodly stack..."
            grep -q "^precedence ::ffff:0:0/96  100" /etc/gai.conf 2>/dev/null || echo "precedence ::ffff:0:0/96  100" >> /etc/gai.conf || true
            COMPOSE_TARGET="${{ vars.COMPOSE_FILE || 'docker-compose.site.yml' }}"
            docker compose -f "$COMPOSE_TARGET" up -d --build --remove-orphans || {
              echo "WARN: First docker compose build attempt hit transient registry timeout, retrying in 3s..."
              sleep 3
              docker compose -f "$COMPOSE_TARGET" up -d --build --remove-orphans
            }

            docker image prune -f
            echo "==> HeyGoodly deployment finished successfully!"
